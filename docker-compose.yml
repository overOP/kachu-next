services:
  backend:
    image: devpradeepchy/kachu-backend:latest
    container_name: kachu-backend
    ports:
      - "5050:5050"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7
    container_name: kachu-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mysql_data:
